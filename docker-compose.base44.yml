# Base44 dev environment for the Yzu视频 monorepo.
#
# Single-origin wiring: the Vite dev server (port 3000) proxies /api to the
# Express API server, matching the frontend's relative "/api" fetch calls and
# Bearer-token auth. Source is bind-mounted into every app service so edits are
# picked up without rebuilding the image.
#
# A local Postgres (with self-signed SSL) is used until NEON_DATABASE_URL is
# provided via /run/base44/app.env; the app prefers NEON_DATABASE_URL when set.

services:
  # One-shot: generate self-signed SSL certs (owned by the postgres user) into
  # a shared volume. The db service reads them read-only. We can't bind-mount
  # certs from the host because git leaves them root-owned and Postgres rejects
  # keys it can't exclusively read; generating them inside as uid 999 avoids
  # that, and the db's normal entrypoint (command starts with `postgres`) still
  # runs initdb.
  pg-certs:
    image: postgres:16
    volumes:
      - pgcerts:/certs
    command: >
      sh -c "
      openssl req -new -x509 -days 3650 -nodes -text
      -keyout /certs/server.key -out /certs/server.crt
      -subj '/CN=localhost' >/dev/null 2>&1
      && chmod 600 /certs/server.key
      && chmod 644 /certs/server.crt
      && chown 999:999 /certs/server.key /certs/server.crt
      "

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: yzu
      POSTGRES_PASSWORD: yzu_pass
      POSTGRES_DB: yzu
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgcerts:/certs:ro
    # Self-signed SSL so the app's hardcoded `ssl: { rejectUnauthorized: false }`
    # pool config connects without code changes.
    command: postgres -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yzu -d yzu"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      pg-certs:
        condition: service_completed_successfully

  setup:
    build:
      context: .
      dockerfile: .base44/Dockerfile.node
    working_dir: /app
    volumes:
      - .:/app
    command: pnpm install --no-frozen-lockfile

  migrate:
    build:
      context: .
      dockerfile: .base44/Dockerfile.node
    working_dir: /app
    volumes:
      - .:/app
    environment:
      # Fallback when NEON_DATABASE_URL is not set; drizzle.config.ts prefers
      # NEON_DATABASE_URL over DATABASE_URL. sslmode=no-verify relaxes TLS only
      # for the local self-signed Postgres cert (scoped to this connection —
      # NODE_TLS_REJECT_UNAUTHORIZED would disable verification process-wide,
      # including for Neon, and trips a Node security warning). Neon has valid
      # certs, so with NEON_DATABASE_URL drizzle verifies TLS normally.
      DATABASE_URL: postgresql://yzu:yzu_pass@db:5432/yzu?sslmode=no-verify
    env_file:
      - /run/base44/app.env
    command: sh -c "node lib/db/scripts/pre-migrate.mjs && pnpm --filter @workspace/db run push-force"
    depends_on:
      db:
        condition: service_healthy
      setup:
        condition: service_completed_successfully

  # One-shot: seed admin account + demo content (categories, videos, plans)
  # on the active DB (Neon when NEON_DATABASE_URL is set, local otherwise).
  seed:
    build:
      context: .
      dockerfile: .base44/Dockerfile.node
    working_dir: /app
    volumes:
      - .:/app
    # No NODE_TLS_REJECT_UNAUTHORIZED needed: the seed script's pg pool already
    # uses ssl: { rejectUnauthorized: false } (required for the local
    # self-signed cert; harmless for Neon).
    environment:
      DATABASE_URL: postgresql://yzu:yzu_pass@db:5432/yzu
    env_file:
      - /run/base44/app.env
    command: node lib/db/scripts/seed-base44.mjs
    depends_on:
      migrate:
        condition: service_completed_successfully
      setup:
        condition: service_completed_successfully

  # Local Bot API Server — lifts the getFile limit from 20 MB to 2 GB and
  # resolves private channels via numeric ID (which MTProto bot auth cannot).
  # Requires TELEGRAM_API_ID + TELEGRAM_API_HASH (same credentials as MTProto,
  # from https://my.telegram.org). The bot token is passed via the URL by the
  # api service — not needed here. When credentials are missing the container
  # idles silently (no crash-loop); the api service boots independently and
  # the client falls back to api.telegram.org.
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_LOCAL: "1"
    env_file:
      - /run/base44/app.env
    volumes:
      - tg-bot-api-data:/var/lib/telegram-bot-api
    # Wait for credentials before starting — prevents crash-loop log spam when
    # TELEGRAM_API_ID/TELEGRAM_API_HASH are not yet provided. When the user
    # sets them via the secrets dashboard the platform recreates this service
    # and the real entrypoint runs.
    entrypoint: ["sh", "-c", "if [ -z \"$$TELEGRAM_API_ID\" ] || [ -z \"$$TELEGRAM_API_HASH\" ]; then echo '[telegram-bot-api] Waiting for TELEGRAM_API_ID and TELEGRAM_API_HASH'; while true; do sleep 3600; done; else exec /docker-entrypoint.sh; fi"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8081 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: .base44/Dockerfile.node
    working_dir: /app
    volumes:
      - .:/app
      - tg-session:/data
    environment:
      PORT: "8080"
      DATABASE_URL: postgresql://yzu:yzu_pass@db:5432/yzu
      NODE_ENV: development
      BASE44_PUBLIC_HOST_SUFFIX: "${BASE44_PUBLIC_HOST_SUFFIX}"
      TELEGRAM_SYNC_INTERVAL_MS: "300000"
      TELEGRAM_SESSION_DIR: "/data"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: pnpm --filter @workspace/api-server run dev
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8080/api/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: .base44/Dockerfile.node
    working_dir: /app
    volumes:
      - .:/app
    environment:
      PORT: "3000"
      BASE_PATH: "/"
      NODE_ENV: development
      # Docker Compose uses service names; the Vite proxy forwards /api to the
      # api service. On Replit (no Docker), the default in vite.config.ts is
      # http://localhost:8080 which works because both run on the same machine.
      API_PROXY_TARGET: "http://api:8080"
    command: pnpm --filter @workspace/yzu-video run dev
    ports:
      - "3000:3000"
    depends_on:
      setup:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  pgcerts:
  tg-session:
  tg-bot-api-data:
